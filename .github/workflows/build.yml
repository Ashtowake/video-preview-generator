name: Workspace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Domain tests
        run: pnpm --filter @video-preview/domain test
      - name: Domain typecheck
        run: pnpm --filter @video-preview/domain typecheck
      - name: Desktop typecheck
        run: pnpm --filter @video-preview/desktop typecheck
      - name: Generate third-party notices
        run: node scripts/generate-third-party-notices.mjs

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Test core crate
        run: cargo test -p vpg-core
      - name: Check CLI crate
        run: cargo check -p vpg-cli
